<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gradient-to-b from-gray-900 to-black min-h-screen flex items-center justify-center px-4">

  <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-8 text-center">

    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="bg-gray-800 text-white rounded-full p-4 text-2xl">
        <img src="" alt="">
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-xl font-semibold text-gray-800">
      GitHub Issues Tracker
    </h2>
    <p class="text-sm text-gray-500 mb-6">
      Sign in to manage your issues
    </p>

    <!-- Form -->
    <form class="space-y-4">

      <!-- Username -->
      <div class="text-left">
        <label class="text-sm text-gray-600">Username</label>
        <input
          type="text" id="input-username"
          placeholder="Enter Username"
          class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
        />
        <p class="text-xs text-purple-500 mt-1">Default: admin</p>
      </div>

      <!-- Password -->
      <div class="text-left">
        <label class="text-sm text-gray-600">Password</label>
        <input
          id="inputPassword"
          type="password"
          placeholder="Enter Password"
          class="w-full mt-1 px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
        />
        <p class="text-xs text-purple-500 mt-1">Default: admin123</p>
      </div>

      <!-- Button -->
      <button  type="button"
        id="loginBtn"
        class="w-full py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-md font-medium hover:opacity-90 transition"
      >
        Sign In
      </button>

    </form>

    <!-- Divider -->
    <div class="my-4 text-gray-400 text-sm">OR</div>

    <!-- Demo Credentials -->
    <div class="bg-gray-100 rounded-md p-4 text-sm text-gray-700">
      <p class="font-medium">Demo Credentials:</p>
      <p>Username: admin</p>
      <p>Password: admin123</p>
    </div>

  </div>

<script src="script/login.js"></script>
</body>
</html>
